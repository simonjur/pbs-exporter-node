services:
  pbs-exporter:
    image: ghcr.io/simonjur/pbs-exporter-node:alpha
    build:
        context: .
        dockerfile: Dockerfile
    container_name: pbs-exporter
    user: '65534'
    restart: always
    ports:
      - "10019:10019"
    environment:
      - PBS_API_TOKEN=
      - PBS_ENDPOINT=https://127.0.0.1:8007
      - PBS_LOGLEVEL=debug
      - PBS_USERNAME=root@pam
      - PBS_API_TOKEN_NAME=pbs-exporter
      - PBS_INSECURE=true
      - PBS_TIMEOUT=10s
      # Keep serving the last known pbs_snapshot_* metrics while PBS is off,
      # persisted to /cache so a container restart does not lose them.
      # - PBS_SNAPSHOTS_CACHE=true
      # - PBS_CACHE_DRIVER=fs
      # - PBS_CACHE_FS_PATH=/cache
    # volumes:
    #   - pbs-exporter-cache:/cache

# volumes:
#   pbs-exporter-cache:
